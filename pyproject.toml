[project]
name = "datika"
version = "0.1.0"
description = "基于 OpenCV 的答题卡生成与自动阅卷工具，支持摄像头实时识别与图片批阅"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
authors = [{ name = "ht7813" }]
keywords = ["answer-sheet", "omr", "opencv", "grading", "ocr", "tkinter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
]
dependencies = [
    "opencv-python>=4.13.0.92",
    "pillow>=12.2.0",
    "fonttools>=4.0.0",
]
